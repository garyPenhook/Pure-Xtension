name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + bundle
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package .vsix
        run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: pure-xtension-vsix
          path: "*.vsix"
