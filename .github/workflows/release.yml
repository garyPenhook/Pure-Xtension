name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # Release packaging must run on the same licensed runner as CI so FIFO
    # and TCP debugger coverage cannot self-skip.
    runs-on: [self-hosted, linux, purebasic-6.41]
    env:
      PUREBASIC_HOME: /home/gary/Apps/purebasic-v6.41
      VSCODE_EXECUTABLE_PATH: /usr/share/code-insiders/code-insiders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify required Linux debug-test runner
        run: |
          test -x "$PUREBASIC_HOME/compilers/pbcompiler"
          test -x "$VSCODE_EXECUTABLE_PATH"
          command -v xvfb-run

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$pkg_version"
            exit 1
          fi

      - name: Typecheck + bundle
        run: npm run compile

      - name: Test
        run: npm test

      - name: Real VS Code integration test
        run: xvfb-run -a npm run test:vscode

      - name: Package .vsix
        run: npx vsce package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
